# Cấu hình Codex cho riêng project này.
# Codex chỉ áp dụng file này khi project được đánh dấu "trusted" trong ~/.codex/config.toml:
#
#   [projects."/duong/dan/tuyet/doi/toi/project"]
#   trust_level = "trusted"

# Hỏi bạn trước khi chạy lệnh ngoài sandbox hoặc cần quyền cao hơn (kể cả khi cần mạng).
approval_policy = "on-request"

# Được ghi file trong thư mục project (để ghi 02-architecture-critique.md, 05-review.md, 06-verification.md).
# Rule "không sửa code" ở bước 5, 6 nằm trong AGENTS.md và các skill.
sandbox_mode = "workspace-write"

# KHÔNG GỌI API: lệnh chạy trong sandbox không có mạng. Muốn dùng mạng, Codex phải xin phép
# (approval_policy = on-request) và bạn quyết định từng lần.
[sandbox_workspace_write]
network_access = false

# Tắt tìm kiếm web của Codex. Tên khóa khác nhau giữa các phiên bản Codex:
# nếu Codex báo lỗi cấu hình ở 2 dòng dưới, xóa chúng và tắt web search trong phần cài đặt của extension.
[tools]
