# Chất lượng code cho Laravel + JavaScript, khớp môi trường XAMPP của project:
#   PHP 8.2, MariaDB 10.4. (Project chưa dùng queue — job kiểm tra queue nằm ở optional/queue/.)
# File luật: đổi file này cần label law-change-approved.
# (Cổng quy trình nằm ở .github/workflows/gate.yml — chạy từ nhánh main, PR không sửa được.)
#
# Job (tên job = tên required status check mà scripts/setup-github.sh bật):
#   php-quality        Pint, Larastan, Pest Arch, toàn bộ test trên MariaDB (không có request HTTP thật)
#   mutation-test      Infection trên dòng PHP thay đổi (chỉ PR)
#   js-quality         build Vite (+ lint/test nếu project có)

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: "8.2"          # khớp XAMPP (PHP 8.2.35). Nâng PHP thì sửa cả ở đây.
  NODE_VERSION: "20"
  MARIADB_IMAGE: "mariadb:10.4"
  PHP_EXTENSIONS: mbstring, intl, pdo_mysql, mysqli, bcmath, gd, zip, curl, fileinfo
  # Biến môi trường test dùng chung
  APP_ENV: testing
  DB_CONNECTION: mysql
  DB_HOST: 127.0.0.1
  DB_PORT: 3306
  DB_DATABASE: app_testing
  DB_USERNAME: root
  DB_PASSWORD: root
  CACHE_DRIVER: array
  CACHE_STORE: array
  SESSION_DRIVER: array
  MAIL_MAILER: array

jobs:
  php-quality:
    name: php-quality
    runs-on: ubuntu-latest
    env:
      QUEUE_CONNECTION: sync
    services:
      mariadb:
        image: mariadb:10.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: app_testing
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
          tools: composer:v2
      - uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ env.PHP_VERSION }}-${{ hashFiles('composer.lock') }}
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Chuẩn bị .env cho test
        run: |
          cp .env.example .env
          php artisan key:generate
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Build frontend (để view có manifest Vite)
        run: npm ci && npm run build
      - name: Chặn request HTTP thật trong test (preventStrayRequests)
        run: |
          if ! grep -rqE "Http::preventStrayRequests\(|->preventStrayRequests\(" tests/; then
            echo "::error::Thiếu Http::preventStrayRequests() trong tests/ (TestCase::setUp). Test có thể gọi API thật. Xem HUONG-DAN mục A3b."
            exit 1
          fi
      - name: Pint (format)
        run: php vendor/bin/pint --test
      - name: Larastan (phân tích tĩnh)
        run: php vendor/bin/phpstan analyse --memory-limit=1G --no-progress --error-format=github
      - name: Pest Arch (test kiến trúc)
        run: php vendor/bin/pest tests/Arch
      - name: Migration chạy được từ đầu và rollback được
        run: |
          php artisan migrate --force
          php artisan migrate:rollback --force
          php artisan migrate --force
      - name: Test (MariaDB)
        run: php artisan test --exclude-group=integration

  mutation-test:
    name: mutation-test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      QUEUE_CONNECTION: sync
    services:
      mariadb:
        image: mariadb:10.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: app_testing
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Có thay đổi PHP trong vùng mutation không?
        id: diff
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch origin "$BASE_REF" --depth=1 || true
          if git diff --name-only "origin/${BASE_REF}...HEAD" -- 'app/Actions/**/*.php' 'app/Services/**/*.php' 'app/Domain/**/*.php' 'app/Support/**/*.php' | grep -q .; then
            echo "php=true" >> "$GITHUB_OUTPUT"
          else
            echo "php=false" >> "$GITHUB_OUTPUT"
            echo "Không đổi logic thuần (Actions/Services/Domain/Support): bỏ qua mutation test."
          fi
      - uses: shivammathur/setup-php@v2
        if: steps.diff.outputs.php == 'true'
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: pcov
          tools: composer:v2
      - if: steps.diff.outputs.php == 'true'
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          cp .env.example .env
          php artisan key:generate
          php artisan migrate --force
      - name: Infection (chỉ dòng thay đổi)
        if: steps.diff.outputs.php == 'true'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: >
          php vendor/bin/infection
          --git-diff-lines
          --git-diff-base=origin/${BASE_REF}
          --threads=max
          --min-msi=60
          --min-covered-msi=75
          --logger-github
          --no-progress

  js-quality:
    name: js-quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm test --if-present
      - run: npm run build
